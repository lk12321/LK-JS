      "N0= " + N0.toFixed(2) + " [sztuk]<br>" +
      "t= " + t.toFixed(2) + " [lat]<br>" +
      "T1/2= " + T12.toFixed(2) + " [lat]<br>" +
      "Lambda= " + lambda.toFixed(7) + " [1/rok]<br>" +
      "N= " + N.toFixed(7) + " [sztuk]");

 {
