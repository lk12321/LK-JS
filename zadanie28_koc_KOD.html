<h3> 1. Rodzaje „filozofii” programowania. </h3>
   <ul>
   <li>Programowanie strukturalne </li>
   <li>Programowanie obiektowe </li>
   </ul>
<h3> 2. Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego. </h3>
<b><u>Programowanie strukturalne</u></b> – paradygmat programowania opierający się na podziale kodu
źródłowego programu na procedury i hierarchicznie ułożone bloki z wykorzystaniem struktur
kontrolnych w postaci instrukcji wyboru i pętli.
Programowanie strukturalne zwiększa czytelność i ułatwia analizę programów, co stanowi znaczącą
poprawę w stosunku do trudnego w utrzymaniu <b>„spaghetti code”</b> często wynikającego z użycia
<b>instrukcji goto</b>.<br><br>

<b><u>Założenia programowania strukturalnego:</u></b>
<ol>
<li>Podzielone bloki kodu mają jeden punkt wejścia (mogą mieć wiele punktów wyjścia),</li>
<li>Wykonywanie wyrażeń w określonej kolejności,</li>
<li>Używanie instrukcji warunkowych (if, if else),</li>
<li>Używanie pętli (for, while, do while),</li>
<li>Unikanie instrukcji skoku (goto),</li>
<li>Unikanie instrukcji break, continua,</li>
<li>W programowaniu proceduralnym (strukturalne) funkcje i zmienne opisujące dany przedmiot nie są ze sobą powiązane.</li>
</ol>
  
<h3> 3. Programowanie obiektowe: definicja (angielski skrót, obiekty, stan, zachowanie, końcowa konkluzja czym jest programowanie obiektowe). </h3>
  <b><u>Programowanie obiektowe</u></b> jest to podejście bardziej naturalne dla ludzi, bardziej zgodne z
rzeczywistością. W pamięci komputera tworzona jest wirtualna rzeczywistość. Definiowane
(powoływane są do wirtualnego życia w pamięci komputera) <b>obiekty</b> na podstawie wcześniej
zdefiniowanych <b>klas</b>. Obiekty mają zdefiniowane <b>metody</b> oraz <b>pola</b>.<br><br>

<b>Programowanie obiektowe (ang. object-oriented programming) </b> — sposób programowania, w którym programy definiuje się za pomocą:
<ul>
  <li> <b>obiektów</b> (obiekty powoływane są do życia wirtualnego przez programistę, mogą być kasowane
    przez programistę), np. okienka w Windows ➤ okienko jest obiektem, </li>
<li> obiekt ma jakiś <b>stan</b> (czyli dane, w programowaniu obiektowym nazywane najczęściej polami), np.
wielkość okienka w Windows, </li>
<li> obiekt wykazuje pewne <b>zachowanie</b> (czyli posiada pewne procedury w programowaniu
obiektowym nazywane metody), np. jest zdefiniowana metoda do zmiany wielkości okienka.</li>
</ul>
➤ Czyli <b>obiektowy program komputerowy</b> wyrażony jest jako zbiór takich obiektów, komunikujących się pomiędzy sobą w celu wykonywania zadań.

<h3> 4. Dlaczego stosujemy programowanie obiektowe? </h3>
<ul>
  <li>Jest to bardziej naturalne podejście przez programistę podczas tworzenia programów ponieważ
otaczający nas świat to różnego rodzaju przedmioty. <br>
     Tworząc program komputerowy dokonujemy
pewnego ich odwzorowania rzeczywistości np. definiujemy obiekt samochód. <br>
     Definiujemy pola, czyli jego stan np. rok produkcji, marka, kolor. <br>
     Definiujemy również metody czyli co umie, np. hamowanie, przyśpieszanie. <br> 
     Definicja obiektu jego metod i pól znajduje się w klasie. <br>
     Następnie na podstawie zdefiniowanego obiektu (może mieć pola oraz metody) powołujemy obiekt w pamięci wirtualnej</li>
<li>Programowanie obiektowe pozwala na lepsze gospodarowanie pamięciom komputera, ponieważ
gdy obiekt staje się zbędny możemy go usunąć co zwolni pamięć zajmowaną przez ten obiekt. <br>
   W programowaniu strukturalnym aby zwalniać pamięć, konieczne było stosowanie dynamicznych struktur danych, np. stos czy kolejka.</li>
<li>W programowaniu obiektowym dobrze napisana i przetestowana klasa pozwala na stosowaniu
przez innych programistów. <br>
   Zaoszczędza to czas i środki pieniężne.</li>
</ul>
  <h3> 5. Omów następujące pojęcia (w krótkiej formie): </h3>
<ul>
<li><b>Klasa</b> ➤ rodzaj foremki, która opisuje nam jak będą wyglądać tworzone na jej podstawie nowe obiekty.<br>
Klasa jest to złożony typ będący opisem (definicją) obiektu/obiektów wraz z definicją pól i metod obiektów.</li>
<li><b>Obiekt</b> ➤ instancja (byt, twór), który powstał na podstawie klasy.<br>
Czyli Obiekty są konstrukcjami programistycznymi mającymi tak zwane właściwości (inaczej pola obiektu), którymi mogą być
zmienne lub inne obiekty.<br>
Z obiektami powiązane są funkcje wykonujące operacje na ich
właściwościach, nazywane metodami.</li>
<li><b>Właściwość</b> ➤ własność obiektu, np. kolor. </li>
<li><b>Metoda</b> ➤ zdolność (czynność) którą umie wykonywać obiekt, np. chodzenie (idź). <br> Realizowane w postaci
konstrukcji podobnej do funkcji. </li>
<li><b>Konstruktor</b> ➤ Metoda wywoływana w momencie inicjalizacji obiektu.<br> Np. tworzymy obiekt, a wraz z tworzeniem
obiektu uruchomi się metoda, która nada np. Imię i Nazwisko.</li>
<li><b>Dziedziczenie</b> ➤ Klasa może dziedziczyć własności od innej klasy.<br> Tworzymy klasę na podstawie innej klasy
pobierając od „rodzica” właściwości i metody, może dopisać nowe pola i nowe metody.</li>
<li><b>Hermetyzacja</b> ➤ Wewnątrz ciała klasy znajdują się pola i metody. <br> Część pól i metod można odpowiednio ukryć przed
"zewnętrznym światem" klasy, tak jak to ma miejsce z przedmiotami ze świata rzeczywistego.</li>
<li><b>Polimorfizm</b> ➤ wielopostaciowość, dany obiekt może zmieniać swoją postać w
zależności od potrzeb.<br> Może to być realizowane w formie metody wywoływanej z różną ilością
parametrów. <br>Tak więc utworzony obiekt może być traktowany polimorficznie, bo zachowuje się różnie
w zależności od sposobu uruchamiania jego metody.</li>
  </ul><br>
