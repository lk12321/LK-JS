<!DOCTYPE html>
<html>
<body bgcolor=#ffb3d5>
  <div style="color:magenta;font-size:40px;">
    <script language="JavaScript">
        var m_koc=prompt("Podaj zmienną m: ","");
        var m=parseInt(m_koc);
    var n1 = Math.floor(m / 1) + 1;
    var a = n1;
    var licznik = a - m;
    var mianownik = a * m;
    var x = Math.floor((a * m) / (a - m)) + 1;
    var b = x;
    var c = (a * m * b) / ((a - m) * b - a * m);
    b = Math.floor(b);
    c = Math.floor(c);
    document.write("1/" + m + " = 1/" + a + " + 1/" + b + " + 1/" + c);
function okno_zamknij() 
 {
 window.close()
 }
    </script>
  </div>
  <input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
