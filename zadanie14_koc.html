<!DOCTYPE html>
<html>
<body bgcolor=#ffb3d5>
  <div style="color:magenta;font-size:40px;">
    <script language="JavaScript">
        var m_koc=prompt("Podaj zmienną m: ","");
        var m=parseInt(m_koc);
      var a = m + 2;
      var licznik = a - m;
      var mianownik = a * m;
      var n = mianownik / licznik;
      n = Math.round(n);
      var c = n + 1;
      var d = n * c;
      document.write("1/" + m + " = 1/" + a + " + 1/" + c + " + 1/" + d);
function okno_zamknij() 
 {
 window.close()
 }
    </script>
  </div>
  <input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
