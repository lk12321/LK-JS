<!DOCTYPE html>
<html>
<body bgcolor=#ffb3d5>
  <div style="color:magenta;font-size:40px;">
    <script language="JavaScript">
        var m_koc=prompt("zmienna m: ","");
        var m=parseInt(m_koc);
    var target = 1 / m;
    var m2 = m + 2;
    var found = false;
    var n, b;
    for (n = m2 + 1; n <= 1000; n++) {
      for (b = n + 1; b <= 1000; b++) {
        var sum = (1 / m2) + (1 / n) + (1 / b);
        if (Math.abs(sum - target) < 0.000001) {
          found = true;
          break;
        }
      }
      if (found) break;
    }

    if (found) {
      document.write("1/" + m + " = 1/" + m2 + " + 1/" + n + " + 1/" + b);
        function okno_zamknij() 
 {
 window.close()
 }
    </script>
    </div>
  <input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
