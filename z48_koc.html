<html>
 <head>
 <title>Sprawdzenie danych Kociszewska</title>
 <meta charset="utf-8">
 </head>
<body bgcolor=#ffb3d5>
<div style="color:red;font-size:50px;">
 <script language="JavaScript">
                 function okno_zamknij() 
 {
 window.close()
 } 
 do {
var liczba1=prompt("wysokość=","");
 var h_koc=parseFloat(liczba1);
 }
 while ( h_koc<=0);
 do {
var liczba1=prompt("podstawa=","");
 var a_koc=parseFloat(liczba1);
 }
 while(!( a_koc>0));
var Pole=a_koc*h_koc/2;
 document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>");
 </script>
</div>
  <br><input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
