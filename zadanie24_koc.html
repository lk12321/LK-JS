<html>
<meta charset="UTF-8">
<body>
<div id="wynik" style="font-size:18px; color:blue; background:#ddd; width:330px; padding:10px; white-space:pre;"></div>
<script>
let x1_koc = parseFloat(prompt("Podaj x1:"));
let x2_koc = parseFloat(prompt("Podaj x2:"));
let tekst_koc = "";
tekst_koc += "x1_koc = " + x1_koc + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + "x2_koc = " + x2_koc + "<br>";
let x1_koc_rad = (x1_koc * Math.PI) / 180;
let liczbaLiter_koc = 4;
let potega_koc = liczbaLiter_koc / (liczbaLiter_koc + 2);
let y1_koc = 3 * Math.pow(x1_koc, potega_koc);
let y2_koc = 2 * Math.cos(x1_koc_rad) + 3 * Math.sin(x1_koc_rad);
let y3_koc = Math.cbrt(
    Math.pow(x1_koc, 5) + 2 * Math.pow(x2_koc, 4) * Math.abs(x1_koc - x2_koc)
);
tekst_koc += "x1_koc = " + x1_koc + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" +
             "x1_koc = " + x1_koc_rad.toFixed(2) + " [radianach]<br>";
tekst_koc += "y1_koc = " + y1_koc.toFixed(2) + "<br>";
tekst_koc += "y2_koc = " + y2_koc.toFixed(2) + "<br>";
tekst_koc += "y3_koc = " + y3_koc.toFixed(2) + "<br>";

document.getElementById("wynik").innerHTML = tekst_koc;
</script>
</body>
</html>
