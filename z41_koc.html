<body bgcolor=#ffb3d5>
<h1>Proste działania</h1>
<h3>Kociszewska 3F</h3>
<label for="a">Podaj pierwszą liczbę:</label> <input type="number" id="a">
<br><br>
<label for="b">Podaj drugą liczbę:</label> <input type="number" id="b">
<br><br>
<input type="button" value="DODAWANIE" onclick="suma_koc()">
<input type="button" value="ODEJMOWANIE" onclick="roznica_koc()">
<input type="button" value="MNOŻENIE" onclick="iloczyn_koc()">
<input type="button" value="DZIELENIE" onclick="iloraz_koc()">
<input type="button" value="TEORIA-Kociszewska" onclick="teoria_koc()">
<div id="wynik.toFixed(2)" style="margin-top:20px;"></div>
<script>
function suma_koc()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;
if (a == "" || b == "")
{
document.getElementById("wynik.toFixed(2)").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var suma_koc = a + b;
document.getElementById("wynik.toFixed(2)").innerHTML = "Wynik działania wynosi: " + suma_koc;
}
//alert(a);
//console.log(a);
}
function roznica_koc()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;
if (a == "" || b == "")
{
document.getElementById("wynik.toFixed(2)").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var roznica_koc = a - b;
document.getElementById("wynik.toFixed(2)").innerHTML = "Wynik działania wynosi: " + roznica_koc;
}
}
function iloczyn_koc()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;
if (a == "" || b == "")
{
document.getElementById("wynik.toFixed(2)").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
var iloczyn_koc = a * b;
document.getElementById("wynik.toFixed(2)").innerHTML = "Wynik działania wynosi: " + iloczyn_koc;
}
}
function iloraz_koc()
{
var a = document.getElementById("a").value;
var b = document.getElementById("b").value;
if (a == "" || b == "")
{
document.getElementById("wynik.toFixed(2)").innerHTML = "Proszę uzupełnić obie liczby.";
} else
{
a = parseFloat(a);
b = parseFloat(b);
if (b == 0)
{
document.getElementById("wynik.toFixed(2)").innerHTML = "Nie wolno dzielić przez zero.";
}
else
{
var iloraz_koc = a / b;
document.getElementById("wynik.toFixed(2)").innerHTML = "Wynik działania wynosi: " + iloraz_koc;
}
}
}
