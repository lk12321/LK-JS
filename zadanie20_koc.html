<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
<body>
<form>
    Punkt A: 
    x: <input type="number" id="xa_koc"> 
    y: <input type="number" id="ya_koc"><br><br>

    Punkt B: 
    x: <input type="number" id="xb_koc"> 
    y: <input type="number" id="yb_koc"><br><br>

    Punkt C: 
    x: <input type="number" id="xc_koc"> 
    y: <input type="number" id="yc_koc"><br><br>

    <button type="button" onclick="oblicz()">Oblicz boki</button>
</form>

<h3>Wyniki:</h3>
<div id="wyniki"></div>

<script>
    // |AB| = sqrt( (xa - xb)^2 + (ya - yb)^2 )
    function AB_koc(xa, ya, xb, yb) {
        return Math.sqrt(Math.pow(xa - xb, 2) + Math.pow(ya - yb, 2));
    }

    // |BC| = sqrt( (xb - xc)^2 + (yb - yc)^2 )
    function BC_koc(xb, yb, xc, yc) {
        return Math.sqrt(Math.pow(xb - xc, 2) + Math.pow(yb - yc, 2));
    }

    // |AC| = sqrt( (xa - xc)^2 + (ya - yc)^2 )
    function AC_koc(xa, ya, xc, yc) {
        return Math.sqrt(Math.pow(xa - xc, 2) + Math.pow(ya - yc, 2));
    }

    function oblicz() {
        let xa_koc = parseFloat(document.getElementById("xa_koc").value);
        let ya_koc = parseFloat(document.getElementById("ya_koc").value);

        let xb_koc = parseFloat(document.getElementById("xb_koc").value);
        let yb_koc = parseFloat(document.getElementById("yb_koc").value);

        let xc_koc = parseFloat(document.getElementById("xc_koc").value);
        let yc_koc = parseFloat(document.getElementById("yc_koc").value);

        let AB = AB_koc(xa_koc, ya_koc, xb_koc, yb_koc);
        let BC = BC_koc(xb_koc, yb_koc, xc_koc, yc_koc);
        let AC = AC_koc(xa_koc, ya_koc, xc_koc, yc_koc);

        document.getElementById("wyniki").innerHTML =
            "AB = " + AB.toFixed(3) + "<br>" +
            "BC = " + BC.toFixed(3) + "<br>" +
            "AC = " + AC.toFixed(3);
    }
</script>

</body>
</html>
