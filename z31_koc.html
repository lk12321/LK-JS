<html> 
  <meta charset="utf-8">

           <script type="text/javascript">

   router_pokaz_kociszewska: function () 
     { 
        document.write("Obiekt: router<br>");

  router.router_pokaz_kociszewska(); 
  router.iloscportow=5;

  } 
  router.router_wypisz_kociszewska(); 
            function okno_zamknij()
             {
window.close() 
             }

     </head>
