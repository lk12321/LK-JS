<meta charset="UTF-8">
<title>Kociszewska Z39_JS</title>

<body bgcolor=#ffb3d5>
<h1 style="color:green;">MENU</h1><br>
<h2 style="color:red;">1-CZERWONY</h2>
<h2 style="color:blue;">2-NIEBIESKI</h2>
<input type="button" name="kociszewska" value="Oblicz" onclick="fun_koc()"/>
<script>
   function okno_zamknij() 
 {
 window.close()
 }
function fun_koc() {
    var x_koc = prompt("Podaj kolor","");
    if(x_koc == 1 || x_koc.toLowerCase() == "czerwony") {
        document.write('<font color="red" size="7">wczytałeś kolor czerwony</font>'); }
    else if(x_koc == 2 || x_koc.toLowerCase() == "niebieski") {
        document.write('<font color="blue" size="1">wczytałeś kolor niebieski</font>'); } 
}
</script>
    <br><br><input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
