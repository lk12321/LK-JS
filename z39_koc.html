function fun_koc() {
    var x_koc = prompt("Podaj kolor","");

        document.write('<h1 style="color:red; font-size: 48px;">wczytałeś kolor czerwony</h1><br />'); } 
    else if(x_koc == 2 || x_koc.toLowerCase() == "niebieski") {
        document.write('<h6 style="color:blue; font-size: 16px;">wczytałeś kolor niebieski</h6><br />'); } 
}
</script>
    <br><input type="button" value="zamknij okno" onclick="okno_zamknij()">
