<html>
<body bgcolor=#ffb3d5>
      <script language="JavaScript">
              function okno_zamknij() 
 {
 window.close()
 }      
  var ile_razy_wyswietlic_koc = 13;
  var wielkosc_liter_koc = 42;
        
    for (var i_koc=1; i_koc <= ile_razy_wyswietlic_koc; i_koc++) {
        if (i_koc % 2 == 1) 
        {
          document.write("<p style='font-size:"+wielkosc_liter_koc+"px;'>Kociszewska</p>");
        }
        else 
        {
          document.write("<p style='font-size:"+wielkosc_liter_koc+"px;'>Lena</p>");
        }
    }
      </script>
    <br><input type="button" value="zamknij okno" onclick="okno_zamknij()">
  </body>
</html>
