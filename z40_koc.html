<html lang="pl-PL">
<meta charset="UTF-8">
<title>Kociszewska Z40_JS</title>
<title>Kociszewska Z40_KOD</title>
 <body bgcolor=#ffb3d5>
<div style="color:red;font-size:50px;">
 <script language="JavaScript">
var x=prompt("podaj argument x=","");
 var x_koc=parseFloat(x);
 document.write("wykonała Lena Kociszewska<br>");
 document.write("czytany argument x="+x_koc+"<br>");
 function f_koc(x_koc) {
 if(x_koc>=9) {return 2;}
 if((x_koc=>-2)&&(x_koc<0)) {return (x_koc+1)*(x_koc+1);}
 if((x_koc=>0)&&(x_koc<2)) {return (x_koc*x_koc*x_koc)+1;}
 if(x_koc<-2) {return 1;}
 }
 document.write("f("+x_koc+")="+f_koc(x_koc)+"<br><br>");
   function okno_zamknij()
             { 
              window.close() 
             } 
 </script>
</div>
      <input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
</body>
</html>
