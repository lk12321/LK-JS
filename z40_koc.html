 <script language="JavaScript">
var x=prompt("podaj argument x=","");
 var x_koc=parseFloat(x);
//zmienna x_kow (zmień _kow na Twoje nazwisko)
//document.write(napisz tekst--> wykonał Jan Kowalski);
 document.write("czytany argument x="+x_koc+"<br>");
 function f_koc(x_koc) {
 if(x_koc>=1) {return 1;}
 if((x_koc=>-2)&&(x_koc<1)) {return x_koc*x_koc;}
 if(x_koc<-2) {return 4;}
 }
 document.write("f="+f_koc(x_koc)+"<br>");
   function okno_zamknij()
             { 
              window.close() 
             } 
 </script>
</div>
      <input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
