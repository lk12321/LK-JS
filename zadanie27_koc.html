<html>
<meta charset="UTF-8">
<script>
function obliczWysokosc(s, odl) {
    return Math.sqrt(s*s - odl*odl);
}
function obliczKat(s, h) {
    return Math.asin(h / s) * (180 / Math.PI);
}
function oblicz() {
    let odl_koc = parseFloat(document.getElementById("odl_koc").value);
    let s_koc   = parseFloat(document.getElementById("s_koc").value);
    if (s_koc <= odl_koc) {
        alert("Błąd: s_koc musi być większe niż odl_koc!");
        return;
    }
    let h_koc = obliczWysokosc(s_koc, odl_koc);
    let kat_koc = obliczKat(s_koc, h_koc);
    document.getElementById("h_koc").value = h_koc.toFixed(2) + " m";
    document.getElementById("kat_koc").value = kat_koc.toFixed(2) + "°";
}
</script>
<body>
<form>
    <label>Odległość między Arturem a Dawidem (odl_koc):</label><br>
    <input type="number" id="odl_koc" step="0.01" required><br><br>
    <label>Długość drogi lotu do punktu nad Dawidem (s_koc):</label><br>
    <input type="number" id="s_koc" step="0.01" required><br><br>
    <button type="button" onclick="oblicz()">Oblicz</button><br><br>
    <label>Wysokość lotu (h_koc):</label><br>
    <input type="text" id="h_koc" readonly><br><br>
    <label>Kąt startu samolotu (kat_koc):</label><br>
    <input type="text" id="kat_koc" readonly><br><br>
</form>
</body>
</html>
