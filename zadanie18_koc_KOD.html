 <script language="JavaScript">
   
 var a=parseFloat(prompt("a=",""));
 var b=parseFloat(prompt("b=",""));
   
 function suma_koc(a, b) {
 return a + b;
 }
   function odejmowanie_koc(a, b) {
 return a - b;
 }
   function mnozenie_koc(a, b) {
 return a * b;
 }
   function od_kwadratu_koc(a, b) {
 return [a*a, b*b];
 }
   function reszta_z_dzielenia_koc(a, b) {
 return a % b;
 }
   document.write("suma= "+suma_koc(a,b)+"<br>");
   document.write("różnica= "+odejmowanie_koc(a, b)+"<br>");
   document.write("iloczyn= "+mnozenie_koc(a, b)+"<br>");
   document.write("sumy do kwadratu= "+od_kwadratu_koc(a, b)+"<br>");
   document.write("reszta z dzielenia a/b= "+reszta_z_dzielenia_koc(a, b)+"<br>");
</script>
