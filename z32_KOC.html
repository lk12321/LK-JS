<html>
    <meta charset="utf-8">
<head>
<script type="text/javascript">

// ===== KONSTRUKTOR (KLASA) =====
function router(rodzaj_r, standardWiFi_r, standardWPA_r, cena_r)
{
    this.rodzaj = rodzaj_r;
    this.standardWiFi = standardWiFi_r;
    this.standardWPA = standardWPA_r;
    this.cena = cena_r;
}

// ===== METODA W PROTOTYPIE (4 POLA) =====
router.prototype.router_kociszewska_wypisz = function()
{
    document.write(
        "Rodzaj: " + this.rodzaj + "<br>" +
        "Standard Wi-Fi: " + this.standardWiFi + "<br>" +
        "Standard WPA: " + this.standardWPA + "<br>" +
        "Cena: " + this.cena + " zł<br><br>"
    );
};

// ===== POWOŁANIE 3 OBIEKTÓW =====
var router1 = new router("bezprzewodowy", "802.11ac", "WPA2", 250);
var router2 = new router("bezprzewodowy", "802.11ax", "WPA3", 400);
var router3 = new router("przewodowy", "802.11n", "WPA2", 180);

    // ===== DODATKOWA WŁAŚCIWOŚĆ POZA CIAŁEM OBIEKTU =====
router.prototype.ilosc_portow = 4;

// ===== DODATKOWA METODA POZA CIAŁEM OBIEKTU =====
router.prototype.router_pokaz_kociszewska = function ()
{
    document.write("Ilość portów: " + this.ilosc_portow + "<br><br>");
};

// ===== DOSTĘP DO WŁAŚCIWOŚCI =====
document.write("Dostęp do właściwości:<br>");
document.write(router1.rodzaj + " " + router1.standardWiFi + " " + router1.standardWPA + " " + router1.cena + "zł<br>");
document.write(router2.rodzaj + " " + router2.standardWiFi + " " + router2.standardWPA + " " + router2.cena + "zł<br>");
document.write(router3.rodzaj + " " + router3.standardWiFi + " " + router3.standardWPA + " " + router3.cena + "zł<br><br>");

// ===== UŻYCIE METODY =====
document.write("Użycie metody router_kociszewska_wypisz():<br>");
router1.router_kociszewska_wypisz();
router2.router_kociszewska_wypisz();
router3.router_kociszewska_wypisz();

// ===== WYWOŁANIE METODY =====
router1.router_pokaz_kociszewska();
router2.router_pokaz_kociszewska();
router3.router_pokaz_kociszewska();

</script>
</head>

<body bgcolor=#ffb3d5>
<br>
Programowanie obiektowe<br>
Obiekt: router
</body>
</html>
