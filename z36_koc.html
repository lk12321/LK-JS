 <title>Kociszewska Z36_JS</title>
<body bgcolor=#ffb3d5>
<div style="color:red;font-size:50px;">
 <script language="JavaScript">
    function okno_zamknij() 
 {
 window.close()
 }
var x=prompt("podaj liczbę x=","");
 var a_dana_koc=parseFloat(x);
 document.write("Czytana liczba x="+a_dana_koc+"<br>");
 if(a_dana_koc % 2 === 0)
 {document.write("<font color=red size=3>liczba jest parzysta</font>"+"<br>");}
  else
 {document.write("<font color=silver size=5>liczba jest nieparzysta</font>"+"<br>");}
   
 </script>
</div>
  <br><input type="button" value="zamknij okno" onclick="okno_zamknij()">
</body>
</html>
